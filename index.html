<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dnes — Boxy</title>
<meta name="description" content="Osa dne, rytmus pravidelných věcí a projekty jako cesty — bez to-do listů.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#f1f1f7;
    --bg:#ffffff; --card:#ffffff; --fill:#f5f6f9; --fill2:#e9eaf0; --line:#eceef3;
    --tx:#14161c; --tx2:#464b57; --tx3:#6b7280; --tx4:#9aa0ac;
    --ink:#17171f; --ink2:#20202a;
    --accent:#2f6df6; --accent-ink:#1f57d6; --accent-soft:#e2ecfe;
    --blue:#2f6df6; --blue-soft:#e2ecfe;
    --good:#1a9b5c; --good-soft:#ddf4e6;
    --amber:#d18f0a; --amber-soft:#fdf1d9;
    --red:#e04260; --red-soft:#fde4e9;
    --violet:#7b5cf0; --magenta:#e8559b; --cyan:#12a8bd; --lime:#8fc63d;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --display:'Inter',-apple-system,sans-serif;
    --card-sh:0 1px 2px rgba(20,22,28,.04), 0 8px 24px -12px rgba(20,22,28,.10);
    --sh:none; --sh-lg:0 24px 60px -20px rgba(20,22,28,.32);
    --r:16px;
  }
  *{ box-sizing:border-box; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:12px; }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation:none !important; transition:none !important; } }
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.55;
  }
  .app{ position:relative; z-index:1; }
  button{ font-family:inherit; }
  .app{ min-height:100vh; display:grid; grid-template-columns:224px minmax(0,1fr); }

  /* ============ sidebar — tmavá lišta ============ */
  aside{
    padding:20px 12px 16px; display:flex; flex-direction:column; gap:22px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
    background:var(--ink); color:#e9e9ee;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 8px; }
  .brand-mark{
    width:26px; height:26px; border-radius:12px;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px;
  }
  .brand-name{ font-size:14px; font-weight:700; letter-spacing:-.01em; color:#fff; }
  .navcard{ display:flex; flex-direction:column; gap:1px; background:transparent; border:none; padding:0; box-shadow:none; }
  .nav-row{
    display:flex; align-items:center; gap:10px; justify-content:flex-start;
    width:100%; text-align:left; border:none; background:transparent;
    color:#9c9ca8; padding:8px 10px; border-radius:12px; cursor:pointer; font-size:13px; font-weight:500;
    transition:background .12s,color .12s;
  }
  .nav-row .ni{ width:22px; height:22px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.06); color:#9c9ca8; flex:none; transition:all .12s; }
  .nav-row .ni svg{ width:13px; height:13px; }
  .nav-row .lbl{ flex:1; text-align:left; }
  .nav-row:hover{ background:rgba(255,255,255,.05); color:#fff; }
  .nav-row:hover .ni{ color:#fff; }
  .nav-row.active{ background:#26262f; color:#fff; font-weight:650; box-shadow:inset 3px 0 0 var(--accent); }
  .nav-row.active .ni{ background:rgba(255,255,255,.14); color:var(--accent); }
  .nav-row.active .nav-meta{ color:rgba(255,255,255,.7); }
  .nav-meta{ font-size:10.5px; color:#6f6f7c; white-space:nowrap; font-variant-numeric:tabular-nums; font-family:var(--mono); }
  .nav-label{ font-size:11.5px; font-weight:600; color:#8b8b96; padding:2px 10px 6px; }
  .proj-item{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:7px 10px; border-radius:12px; }
  .proj-item .nm{ display:flex; align-items:center; gap:8px; overflow:hidden; max-width:100%; font-weight:600; font-size:12.5px; }
  .proj-dot{ width:7px; height:7px; border-radius:2px; flex:none; }
  .proj-name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .proj-phase{ font-size:10.5px; color:#6f6f7c; padding-left:15px; font-weight:500; }
  .proj-item.active .proj-phase{ color:rgba(255,255,255,.75); }
  .btn-ghost-add{
    text-align:left; border:none; background:transparent; color:#6f6f7c;
    padding:8px 10px; border-radius:12px; cursor:pointer; font-size:12.5px; transition:all .12s;
  }
  .btn-ghost-add:hover{ color:#fff; background:rgba(255,255,255,.05); }
  .side-footer{ margin-top:auto; display:flex; flex-direction:column; gap:2px; }
  .syncpill{ display:flex; align-items:center; gap:7px; padding:8px 10px; font-size:10.5px; color:#6f6f7c; font-family:var(--mono); }
  .syncpill .led{ width:6px; height:6px; border-radius:50%; background:#4a4a56; flex:none; }
  .syncpill.on .led{ background:var(--good); }
  .syncpill.wait .led{ background:var(--amber); }
  .syncpill.err .led{ background:var(--red); }

  /* ============ main ============ */
  main{ padding:40px 48px 96px; display:flex; flex-direction:column; gap:32px; max-width:1180px; width:100%; min-width:0; margin-inline:auto; }
  /* na hodně širokém okně se obsah nerozjede — drží se čitelné šířky uprostřed */
  @media (min-width:1700px){ main{ padding:46px 56px 100px; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none;} }
  main > *{ animation:rise .24s ease both; }
  .hdr{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; }
  .hdr-date{ font-size:13px; color:var(--tx3); font-weight:600; }
  h1{ margin:8px 0 0; font-family:var(--display); font-size:46px; font-weight:600; letter-spacing:-.01em; line-height:1.04; font-optical-sizing:auto; }
  .hdr-sub{ font-size:16px; line-height:1.5; color:var(--tx2); margin-top:12px; max-width:60ch; }
  .hdr-sub b{ font-weight:700; color:var(--tx); box-shadow:inset 0 -.5em 0 var(--accent-soft); }
  .stats{ display:flex; align-items:flex-start; gap:26px; }
  .stat{ text-align:right; }
  .stat .num{ font-size:24px; font-weight:800; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat .lbl{ font-size:11px; color:var(--tx3); font-weight:500; margin-top:2px; }
  .daybar-wrap{ min-width:150px; }
  .daybar-txt{ font-size:12px; color:var(--tx2); font-weight:550; text-align:right; }
  .daybar{ height:4px; border-radius:0; background:var(--fill2); overflow:hidden; margin-top:7px; }
  .daybar > div{ height:100%; background:var(--accent); transition:width .5s ease; }

  /* segmented control */
  .seg{ display:inline-flex; background:var(--fill); border-radius:12px; padding:3px; gap:2px; flex-wrap:wrap; }
  .seg button{
    border:none; background:transparent; color:var(--tx2); cursor:pointer;
    padding:6px 12px; border-radius:12px; font-size:12px; font-weight:600;
    display:flex; align-items:center; gap:7px; transition:all .12s; white-space:nowrap;
  }
  .seg button:hover{ color:var(--tx); }
  .seg button.active{ background:var(--ink); color:#fff; }
  .seg .cdot{ width:7px; height:7px; border-radius:2px; }
  .seg .cnt{ color:currentColor; opacity:.55; font-weight:600; font-size:11px; font-family:var(--mono); }

  /* ============ sekce — barevná lišta místo karty ============ */
  section{ display:flex; flex-direction:column; gap:14px; }
  .sblock{
    position:relative; border-radius:0; padding:2px 0 0 20px;
    background:transparent; border:none; border-left:3px solid var(--secc,var(--line)); box-shadow:none;
  }
  .sblock > *{ position:relative; z-index:1; }
  .sblock.blue,.sblock.green,.sblock.violet,.sblock.amber,.sblock.cyan,.sblock.rose{ --secc:var(--line); }
  .sec-ico{ /* neutrální — barva v UI znamená stav, ne dekoraci */
    width:26px; height:26px; border-radius:12px; color:#fff;
    background:var(--ink);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .sec-ico svg{ width:14px; height:14px; }
  .eyebrow{ font-size:12px; font-weight:500; color:var(--tx3); }
  h2{ margin:0; font-family:var(--display); font-size:22px; font-weight:600; letter-spacing:-.005em; font-optical-sizing:auto; }
  .sec-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .sec-head-l{ display:flex; align-items:center; gap:10px; }
  .sec-head.stack{ flex-direction:column; align-items:stretch; gap:12px; }
  .sec-head.stack .sec-head-l{ align-items:center; }
  .sec-head.stack .row2{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .sec-sub{ font-size:12.5px; color:var(--tx3); margin-left:4px; }
  .sec-link{ border:none; background:none; color:var(--tx2); font-size:12px; font-weight:600; cursor:pointer; padding:6px 12px; border-radius:12px; box-shadow:inset 0 0 0 1px var(--line); transition:all .12s; }
  .sec-link:hover{ color:var(--tx); box-shadow:inset 0 0 0 1px var(--tx3); text-decoration:none; }

  /* ============ hero — denní linka ============ */
  .sblock.darkp{
    background:var(--ink); border:none; border-left:none; color:#f4f4f7;
    border-radius:12px; padding:26px 28px 26px;
  }
  .darkp h2{ color:#fff; font-size:20px; }
  .darkp .sec-sub{ color:#83838f; }
  .darkp .eyebrow{ color:var(--accent) !important; }
  .darkp .sec-link{ color:#c9c9d2; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); }
  .darkp .sec-link:hover{ color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.4); }
  .darkp .tl-card{ background:transparent; box-shadow:none; padding:0; border:none; }
  .darkp .tl-hours span{ font-family:var(--mono); font-size:10px; color:#61616d; font-weight:500; }
  .darkp .tl-lanes{ background:repeating-linear-gradient(to right, rgba(255,255,255,.07) 0 1px, transparent 1px calc(100%/11)); }
  .darkp .lane{ height:74px; border-radius:12px; background:rgba(255,255,255,.035); }
  .darkp .lane.slim{ height:38px; }
  .darkp .lane + .lane{ margin-top:16px; }
  .darkp .lane.plan{ background:rgba(31,75,255,.12); }
  .darkp .lane.plan.droppable{ background:rgba(255,59,18,.18); box-shadow:inset 0 0 0 2px var(--accent); }
  .darkp .lane-tag{ color:#9a9aa6; top:-19px; font-size:12px; font-weight:600; }
  .darkp .lane-tag .sec-link{ border:none; box-shadow:none; padding:0; }
  .darkp .tl-hours{ margin-bottom:30px; }
  .darkp .tl-block{ background:rgba(255,255,255,.08); box-shadow:none; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:7px 11px; top:6px; bottom:6px; }
  .darkp .tl-block .n{ color:#f2f2f6; font-size:13px; }
  .darkp .tl-block .t{ color:#83838f; font-family:var(--mono); font-size:9px; }
  .darkp .tl-block.now{ box-shadow:0 0 0 1.5px var(--accent), 0 0 24px rgba(255,59,18,.3); }
  .darkp .tl-block.past{ opacity:.5; }
  .darkp .tl-block.past .n{ text-decoration:none; }
  .darkp .plan-block{ border:none; }
  .darkp .tl-nowline{ width:2px; border-left:none; background:var(--accent); box-shadow:0 0 16px rgba(255,59,18,.9); }
  .darkp .tl-nowlabel{ background:var(--accent); color:#fff; font-family:var(--mono); box-shadow:none; }
  .darkp .qchips{ border-top:1px solid rgba(255,255,255,.08) !important; }
  .darkp .q-lbl{ font-size:12.5px; color:#9a9aa6; font-weight:500; }
  .darkp .qchip{ border:1px solid rgba(255,255,255,.12); }
  .darkp .seg{ background:rgba(255,255,255,.07) !important; }
  .darkp .seg button{ color:#9c9ca8; }
  .darkp .seg button:hover{ color:#fff; }
  .darkp .seg button.active{ background:#fff; color:var(--ink); }
  .darkp .week-grid{ gap:8px; }
  .darkp .wday{ background:rgba(255,255,255,.045); min-height:160px; padding:11px 10px; border-radius:12px; }
  .darkp .wday.today{ background:rgba(255,255,255,.09); box-shadow:inset 0 0 0 1.5px var(--accent); }
  .darkp .wday.droppable{ background:rgba(255,59,18,.18); box-shadow:inset 0 0 0 2px var(--accent); }
  .darkp .wday .dh .dn{ color:#f2f2f6; font-size:12px; }
  .darkp .wday.today .dh .dn{ color:var(--accent); }
  .darkp .wday .dh .dd{ color:#61616d; font-family:var(--mono); font-size:9.5px; }
  .darkp .wday .ev{ color:#83838f; }
  .darkp .wday .ev b{ color:#c9c9d2; font-family:var(--mono); }
  .darkp .wday .addf{ color:#5a5a66; }
  .darkp .wday .addf:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .darkp .mind-note{ color:#61616d; }
  .darkp .lane-empty{ color:#5a5a66; }
  .darkp .allday span{ background:rgba(255,255,255,.08); color:#c9c9d2; }
  .darkp .empty-tile{ background:rgba(255,255,255,.05) !important; color:#83838f; }
  .qadd{
    border:1px dashed rgba(255,255,255,.2); background:transparent; color:#83838f;
    border-radius:12px; padding:6px 14px; font-size:12px; font-weight:600; cursor:pointer; transition:all .12s;
  }
  .qadd:hover{ color:#fff; border-color:rgba(255,255,255,.45); }
  .hero-head{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px; }
  .hero-id{ display:flex; align-items:center; gap:16px; }
  .hero-clock{
    font-family:var(--mono); font-size:32px; font-weight:600; letter-spacing:-.05em; line-height:1;
    color:#fff; font-variant-numeric:tabular-nums;
  }
  .hero-clock small{ display:block; font-size:12px; font-weight:500; color:#9a9aa6; margin-top:6px; }
  .hero-div{ width:1px; align-self:stretch; background:rgba(255,255,255,.12); }
  .dayline{ position:relative; height:3px; background:rgba(255,255,255,.08); margin-top:16px; overflow:hidden; }
  .dayline > div{ position:absolute; top:0; bottom:0; left:0; background:var(--accent); }
  .dayfoot{ font-family:var(--mono); font-size:10.5px; color:#61616d; margin-left:auto; }

  /* ============ dlaždice (metriky / systémy — vypnuté sekce) ============ */
  .met-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .mtile{
    position:relative; background:var(--card); border-radius:12px; padding:12px 14px;
    display:flex; flex-direction:column; gap:5px; box-shadow:none; border:1px solid var(--line); text-align:left;
    width:100%; cursor:pointer; transition:border-color .13s;
  }
  .mtile:hover{ border-color:var(--tx4); }
  .mtile .lb{ font-size:11px; font-weight:600; color:var(--tx2); line-height:1.3; padding-right:14px; display:flex; align-items:center; gap:6px; }
  .mtile .lb i{ width:6px; height:6px; border-radius:2px; flex:none; }
  .mtile .val{ font-size:23px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.1; }
  .mtile .val.good{ color:var(--good); }
  .mtile .val.bad{ color:var(--red); }
  .mtile .val.mut{ color:var(--tx4); font-size:14px; font-weight:600; }
  .mtile .sub{ font-size:10.5px; color:var(--tx3); }
  .sys-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:1100px){ .sys-grid{ grid-template-columns:repeat(2,1fr); } }
  .stile{
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 13px;
    display:flex; flex-direction:column; gap:7px; box-shadow:none; text-align:left;
    width:100%; cursor:pointer; overflow:hidden; transition:border-color .13s;
  }
  .stile:hover{ border-color:var(--tx4); }
  .stile .nm{ font-size:13px; font-weight:650; letter-spacing:-.01em; display:flex; align-items:center; gap:7px; padding-right:20px; }
  .stile .nm i{ width:7px; height:7px; border-radius:2px; flex:none; }
  .stile .st{ font-size:11.5px; font-weight:650; display:flex; align-items:center; gap:6px; }
  .stile .st.ok{ color:var(--good); }
  .stile .st.issue{ color:var(--red); }
  .stile .st.none{ color:var(--tx3); font-weight:550; }
  .stile .note{ font-size:11px; color:var(--tx2); line-height:1.35; }
  .stile .note a{ color:var(--red); font-weight:650; }
  .stile.issue{ border-color:var(--red); }
  .stile.holding::after{
    content:""; position:absolute; left:0; top:0; bottom:0; width:0;
    background:rgba(15,169,88,.16); border-right:2.5px solid var(--good);
    animation:holdfill .7s linear forwards; pointer-events:none;
  }

  /* ============ KPI proužek ============ */
  .kpis{ display:flex; align-items:stretch; gap:0; }
  .kpi{ padding:0 22px; display:flex; flex-direction:column; gap:4px; border-left:1px solid var(--line); }
  .kpi:first-child{ border-left:none; padding-left:0; }
  .kpi:last-child{ padding-right:0; }
  .kpi b{ font-size:27px; font-weight:750; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
  .kpi b i{ font-style:normal; font-size:14px; font-weight:600; color:var(--tx4); letter-spacing:-.01em; }
  .kpi span{ font-size:12px; font-weight:500; color:var(--tx3); white-space:nowrap; }
  .kpi.warn b{ color:var(--red); }
  .kpi.good b{ color:var(--good); }
  .spark{ display:flex; align-items:flex-end; gap:3px; height:16px; margin-top:2px; }
  .spark i{ width:6px; background:var(--tx); opacity:.12; min-height:3px; }
  .spark i.on{ opacity:.5; }
  .spark i.tdy{ opacity:1; background:var(--accent); }

  .grid2{ display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:26px; align-items:start; }
  .grid2 > section{ min-width:0; }
  @media (max-width:1180px){ .grid2{ grid-template-columns:minmax(0,1fr); } }

  /* ============ cesta ============ */
  /* ============ trasa (kreslená cesta se zastávkami) ============ */
  .route{ position:relative; margin:4px 0 2px; width:100%; padding:26px 0 36px; }
  .route.tiny svg{ height:104px; }
  .route svg{ display:block; width:100%; height:148px; overflow:visible; }
  .route .ln{ fill:none; stroke-linecap:round; vector-effect:non-scaling-stroke; }
  .route .ln.rest{ stroke:#dedee6; stroke-width:3; stroke-dasharray:1 9; }
  .route .ln.done{ stroke-width:4.5; }
  .route .pins{ position:absolute; inset:26px 0 36px; pointer-events:none; }
  .pin{ position:absolute; transform:translate(-50%,-50%); pointer-events:auto; }
  .pin .bead{
    width:16px; height:16px; border-radius:50%; background:#fff; border:3px solid var(--good);
    transition:all .3s;
  }
  .pin.future .bead{ border-color:#d3d3dd; border-width:2.5px; width:13px; height:13px; }
  .pin.current .bead{
    width:26px; height:26px; border:5px solid var(--accent); background:#fff;
    box-shadow:0 0 0 7px var(--accent-soft);
  }
  .pin.current::after{
    content:""; position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px;
    border-radius:50%; border:2px solid var(--accent); animation:ripple 2.6s ease-out infinite;
  }
  @keyframes ripple{ 0%{ transform:scale(1); opacity:.55; } 70%{ transform:scale(2.5); opacity:0; } 100%{ opacity:0; } }
  .pin .lab{
    position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap;
    font-size:13.5px; font-weight:600; color:var(--tx2);
  }
  .pin.up .lab{ bottom:calc(100% + 12px); }
  .pin.down .lab{ top:calc(100% + 12px); }
  .pin.done .lab{ color:var(--tx4); }
  .pin.current .lab{ font-family:var(--display); font-style:italic; font-size:19px; font-weight:600; color:var(--tx); letter-spacing:-.01em; }
  .pin.current.up .lab{ bottom:calc(100% + 16px); }
  .pin.current.down .lab{ top:calc(100% + 16px); }
  .pin .youare{
    display:block; font-size:12px; font-weight:600;
    color:var(--accent-ink); margin-bottom:4px;
  }
  .pin.down .youare{ margin:0 0 0; order:2; }
  .flagpin{ font-size:15px; line-height:1; }
  .pin.first .lab{ transform:translateX(-38%); }
  .pin.last .lab{ transform:translateX(-62%); }
  @media (max-width:900px){
    .route svg{ height:150px; }

  /* kalendářík */

  /* ============ plocha ============ */

  /* ============ dialog & toast ============ */
  .overlay{ position:fixed; inset:0; background:rgba(14,14,18,.45); display:flex; align-items:flex-start; justify-content:center; padding-top:9vh; z-index:20; overflow:auto; }

  .btn-light{ border:none; background:var(--fill); padding:10px 16px; border-radius:12px; font-size:13px; font-weight:600; cursor:pointer; color:var(--tx); transition:background .13s; }
  .btn-light:hover{ background:var(--fill2); }

    font-family:var(--mono); font-size:10.5px; background:var(--ink); color:#c9c9d2;
    border-radius:12px; padding:12px; white-space:pre-wrap; word-break:break-word; max-height:160px; overflow:auto;
  }
  .cal-row{ display:flex; align-items:center; gap:9px; padding:6px 2px; font-size:13px; }

  }

  /* ---------- barevné odlišení projektů + sbalování ---------- */

    background:var(--pc-soft, var(--fill));

  .cesta .pcard.shut{ padding-bottom:18px; }
  .cesta .pcard.shut .pnote{ display:none; }
  /* aktuální zastávka zůstává modrá ve všech projektech — „teď" má být hned poznat */


  /* ---------- zastávka hotová mimo pořadí + podržení ---------- */
  .pin.markable{ cursor:pointer; touch-action:none; }

  .bpin .bead{

  /* ---------- podržení: čitelná zpětná vazba ---------- */
  .pin{ -webkit-user-drag:none; user-select:none; -webkit-user-select:none; }

    position:absolute; padding:5px 9px; margin-left:-9px; border-radius:9px; overflow:hidden;

  .cesta .bpin.holding .lab::before{

  /* větší plocha na chycení */
  .cesta .bpin::before{
    content:""; position:absolute; left:-10px; right:-10px; top:-11px; bottom:-11px;
  }
  .cesta .pin.markable::before{
    content:""; position:absolute; left:-12px; right:-12px; top:-12px; bottom:-12px;

  /* ---------- psaní kroku přímo v trase ---------- */
  .bpin.bdraft .bead{ background:#fff; border:3px dashed var(--accent); }

  .stepinput{

  /* ---------- odznak „tady vede odbočka" ---------- */
  .cesta .pin .scaret{

    background:rgba(224,83,60,.16); border-right-color:#e0533b;
  }

<script>
/* ============================================================
   STORAGE — stejný klíč jako původní Dnes, data uživatelů přežijí
   ============================================================ */
const KEY = "dnes.planner.v1";
const Store = (() => {
  let ok = true, mem = null;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch(e){ ok = false; }
  return {
    persistent: ok,
    read(){
      if(!ok) return mem;
      try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }
      catch(e){ return null; }
    },
    write(v){
      if(!ok){ mem = v; return; }
      try { localStorage.setItem(KEY, JSON.stringify(v)); }
      catch(e){ ok = false; mem = v; toast("Úložiště je plné — data držím jen v paměti."); }
    }
  };
})();

/* ============================================================
   MODEL
   ============================================================ */
const DAY = 86400000;
const DOT_COLORS = ["#2f6df6", "#7b5cf0", "#12a8bd", "#e8559b", "#d18f0a", "#1a9b5c"];

function blank(){
  return {
    version:1, tasks:[], labels:[], sections:[],
    settings:{theme:"light", dayStart:8, dayEnd:19, view:"day", taskFilter:"all", collapsed:[], dayGroup:false},
    google:{clientId:"", hidden:[]},
    sync:{url:"", key:""},
    clients:[], rhythms:[], projects:[], notes:[], history:[], dayPlan:{}, weekPlan:{}, dayModes:{}, quickBlocks:[], systems:[], metrics:[],
    boxyMigrated:0,
    updatedAt:0
  };
}
function payload(){
  return {
    version:state.version, tasks:state.tasks, labels:state.labels, sections:state.sections,
    settings:state.settings, google:state.google,
    clients:state.clients, rhythms:state.rhythms, projects:state.projects,
    notes:state.notes, history:state.history, dayPlan:state.dayPlan, weekPlan:state.weekPlan, dayModes:state.dayModes, quickBlocks:state.quickBlocks, systems:state.systems, metrics:state.metrics,
    boxyMigrated:state.boxyMigrated, updatedAt:state.updatedAt
  };
}

let state = Object.assign(blank(), Store.read() || {});
if(!state.google) state.google = {clientId:"", hidden:[]};
if(!Array.isArray(state.google.hidden)) state.google.hidden = [];
if(!state.sync) state.sync = {url:"", key:""};
["clients","rhythms","projects","notes","history","tasks","labels","sections","systems","metrics"].forEach(k => {

const RECUR_DAYS = { daily:1, weekdays:1, weekly:7, monthly:30, yearly:365 };
function migrateBoxy(){
  if(state.boxyMigrated) return;
  if(!state.clients.length){
    state.clients = [
      {id:"emarkest", name:"eMarkest"},
      {id:"fuerto", name:"Fuerto"},
      {id:"kotva", name:"Kotva bistro"},
      {id:"interni", name:"Interní"}
    ];
  }
  const templates = state.tasks.filter(t => t && t.recur && !t.recurParentId);
  templates.forEach(t => {
    const base = RECUR_DAYS[t.recur] || 7;
    const every = Math.max(1, base * (t.recurEvery || 1));
    const instances = state.tasks.filter(x => x.recurParentId === t.id && x.done && x.date);
    let last = Date.now() - every * DAY;
    if(instances.length){
      const latest = instances.map(x => x.date).sort().pop();
      const [y,m,d] = latest.split("-").map(Number);
      last = new Date(y, m-1, d, 12).getTime();
    }
    state.rhythms.push({
      id:"r_" + t.id, clientId:"interni", name:t.title || "Rutina",
      cadenceLabel: every === 1 ? "denně" : every === 7 ? "1× týdně" : every === 14 ? "po 14 dnech" : every === 30 ? "1× měsíčně" : "po " + every + " dnech",
      everyDays: every, lastRunAt: last
    });
  });
  state.tasks.filter(t => t && !t.date && !t.done && !t.recur && !t.recurParentId).forEach(t => {
    state.notes.push({id:"n_" + t.id, text:t.title || "", category:"práce", createdAt:Date.now()});
  });
  state.boxyMigrated = 1;
  save();
}

const TL_START = 8, TL_END = 19, TL_SPAN = TL_END - TL_START;
const SNAP = 0.25;
function nowInfo(){
  const n = new Date();
  const cur = n.getHours() + n.getMinutes()/60;
  const pct = Math.max(0, Math.min(100, (cur - TL_START) / TL_SPAN * 100));
  const dayPct = Math.round(Math.max(0, Math.min(1, (cur - TL_START) / TL_SPAN)) * 100);
  const leftMin = Math.max(0, Math.round((TL_END - cur) * 60));
  return { pct, dayPct, leftH:Math.floor(leftMin/60), leftM:leftMin%60, cur };
}
function todaysEvents(){
  const evs = (G.cache[planDate] || []);
  const timed = [], allDay = [];
  evs.forEach(e => {
    if(e.allDay){ allDay.push(e); return; }
    const s = new Date(e.start), en = e.end ? new Date(e.end) : new Date(s.getTime() + 30*60000);
    let sh = s.getHours() + s.getMinutes()/60, eh = en.getHours() + en.getMinutes()/60;
    if(eh <= TL_START || sh >= TL_END) return;
    sh = Math.max(sh, TL_START); eh = Math.min(eh, TL_END);
    timed.push({ title:e.title, sh, eh });
  });
  timed.sort((a,b) => a.sh - b.sh);
  return { timed, allDay };
}
function planBlocks(){ if(!state.dayPlan[planDate]) state.dayPlan[planDate] = []; return state.dayPlan[planDate]; }

/* ---- týdenní fokus ---- */
function weekDates(){
  const n = new Date();
  const dow = (n.getDay() + 6) % 7;
  const mon = new Date(n); mon.setDate(n.getDate() - dow);
  return Array.from({length:7}, (_, i) => {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  });
}
let boardOffset = 0;
function boardDates(){
  const n = new Date();
  const dow = (n.getDay() + 6) % 7;
  const mon = new Date(n);
  mon.setDate(n.getDate() - dow + boardOffset * 7);
  return Array.from({length:5}, (_, i) => {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  });
}
const MONTHS_G = ["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
function boardRange(){
  const ks = boardDates();
  const a = parseDate(ks[0]), b = parseDate(ks[4]);
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()}.–${b.getDate()}. ${MONTHS_G[a.getMonth()]}`
    : `${a.getDate()}. ${MONTHS_G[a.getMonth()]} – ${b.getDate()}. ${MONTHS_G[b.getMonth()]}`;
}
function shiftBoard(n){
  boardOffset = n === 0 ? 0 : boardOffset + n;
  render();
  if(state.google.clientId && gConnected()){
    (async () => {
      for(const k of boardDates()){ if(!G.cache[k]) await gFetchDay(k); }
      render();
    })().catch(() => {});
  }
}
function weekEventsFor(key){
  return (G.cache[key] || []).filter(e => !e.allDay).map(e => {
    const s = new Date(e.start);
    return { t: `${pad(s.getHours())}:${pad(s.getMinutes())}`, title: e.title };
  }).sort((a,b) => a.t.localeCompare(b.t));
}
function dayDragOver(e, key){ e.preventDefault(); e.dataTransfer.dropEffect = "copy"; const el = document.getElementById("wd-" + key); if(el) el.classList.add("droppable"); }
function dayDragLeave(e, key){ const el = document.getElementById("wd-" + key); if(el) el.classList.remove("droppable"); }
function dropDay(e, key){
  e.preventDefault();
  const el = document.getElementById("wd-" + key); if(el) el.classList.remove("droppable");
  let d;
  try { d = JSON.parse(e.dataTransfer.getData("text/plain")); } catch(_){ return; }
  if(d.type === "move"){
    const it = takeMoved(d); if(!it) return;
    if(!state.weekPlan[key]) state.weekPlan[key] = [];
    state.weekPlan[key].push(it);
    save(); render(); return;
  }
  const it = dropItemFrom(d); if(!it) return;
  if(!state.weekPlan[key]) state.weekPlan[key] = [];
  state.weekPlan[key].push(it);
  save(); render();
}
function removeFocus(key, id){
  state.weekPlan[key] = (state.weekPlan[key] || []).filter(f => f.id !== id);
  save(); render();
}

}

function blockHtml(b, cls, extra, colors){
  const l = (b.sh - TL_START) / TL_SPAN * 100;
  const w = (b.eh - b.sh) / TL_SPAN * 100;
  const compact = (b.eh - b.sh) < 0.9;
  const style = colors ? `background:${colors.bg};color:${colors.tx};` : "";
  return `<div class="tl-block ${cls}" style="left:${l}%;width:${w}%;${style}" ${extra || ""}>
    ${compact ? "" : `<div class="t" ${colors ? `style="color:${colors.tx};opacity:.65;"` : ""}>${fmtHM(b.sh)}–${fmtHM(b.eh)}</div>`}
    <div class="n">${esc(b.title)}</div>
    ${cls.includes("plan") ? `<button class="x" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation(); removePlan('${b.id}')">✕</button><div class="rsz" onpointerdown="planResizeStart(event,'${b.id}')"></div>` : ""}

}

/* ---- trasa: kreslená cesta se zastávkami ---- */
const RT = { W:1000, H:170, PAD:74, AMP:25, MID:86 };
function routePoints(n, cfg){
  const { W, PAD, AMP, MID } = cfg || RT;
  if(n <= 1) return [{ x: W/2, y: MID }];
  const step = (W - PAD*2) / (n - 1);
  return Array.from({length:n}, (_, i) => ({
    x: PAD + i*step,
    y: MID + (i % 2 === 0 ? -AMP : AMP) * (n === 2 ? .55 : 1)
  }));
}
function routeD(pts){
  if(pts.length < 2) return "";
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for(let i = 1; i < pts.length; i++){
    const a = pts[i-1], b = pts[i], dx = (b.x - a.x) * .55;
    d += ` C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
  }
  return d;
}
/* odbočka: svisle dolů pod zastávkou, karta roste podle počtu kroků */
const BR = { GAP:104, STEP:62, PAD:36, SCALE:0.694, MINX:96, MAXX:600 };
function branchGeom(par, rows){
  const x = Math.min(Math.max(par.x, BR.MINX), BR.MAXX);
  const y0 = par.y + BR.GAP;               // start až pod popiskem zastávky
  const pts = Array.from({length:rows}, (_, i) => ({ x, y: y0 + i * BR.STEP }));
  const last = pts.length ? pts[pts.length - 1].y : y0;
  return { x, y0, pts, VH: last + BR.PAD };
}

/* psaní kroku rovnou v trase, bez okna */
let _stepDraft = null, _draftTok = 0;
function addStep(e, pid, idx, at){
  if(e && e.stopPropagation) e.stopPropagation();
  const pr = state.projects.find(x => x.id === pid); if(!pr) return;
  const arr = phaseSteps(pr, idx);
  _stepDraft = { pid, idx, at: (typeof at === "number" ? at : arr.length), tok: ++_draftTok };
  setStepOpen(pid, idx);
}
function cancelDraft(){ _stepDraft = null; render(); }
function saveDraft(inp, keepGoing){
  const d = _stepDraft;
  if(!d || inp.dataset.tok !== String(d.tok)) return;
  const name = (inp.value || "").trim();
  const pr = state.projects.find(x => x.id === d.pid);
  if(!name || !pr){ _stepDraft = null; render(); return; }
  const arr = phaseSteps(pr, d.idx);
  const at = Math.min(d.at, arr.length);
  arr.splice(at, 0, { id:uid(), name, done:false });
  _stepDraft = keepGoing ? { pid:d.pid, idx:d.idx, at: at + 1, tok: ++_draftTok } : null;
  save(); render();
}
function draftKey(e, inp){
  if(e.key === "Enter"){ e.preventDefault(); saveDraft(inp, true); }
  else if(e.key === "Escape"){ e.preventDefault(); cancelDraft(); }
}
function routeHtml(p, cur){
  const routeCol = projColor(p);
  const openIdx = openStepIdx(p, cur);
  const n = p.phases.length;
  const pts = routePoints(n);
  const uid2 = "rg" + p.id.replace(/[^a-z0-9]/gi, "");
  const full = routeD(pts);
  const done = routeD(pts.slice(0, Math.max(1, cur + 1)));
  const hasBr = openIdx >= 0 && !!p.phases[openIdx];
  const sts = hasBr ? phaseSteps(p, openIdx) : [];
  const par = pts[openIdx] || pts[0];
  const drafting = hasBr && _stepDraft && _stepDraft.pid === p.id && _stepDraft.idx === openIdx;
  const rows = sts.map((st, i) => ({ st, i }));
  if(drafting) rows.splice(Math.min(_stepDraft.at, rows.length), 0, { draft:true });
  const total = rows.length + (drafting ? 0 : 1);
  const g = hasBr ? branchGeom(par, total) : null;
  const VH = hasBr ? g.VH : RT.H;
  const wMax = Math.min(1000, 330 + (n - 1) * 168);
  const bc = hasBr ? tint(routeCol, .55) : "";
  const stem = hasBr ? `M ${par.x} ${par.y} C ${par.x} ${par.y + 46}, ${g.x} ${g.y0 - 46}, ${g.x} ${g.y0}` : "";
  const lastReal = hasBr ? (rows.length ? g.pts[rows.length - 1].y : g.y0) : 0;
  const rail = hasBr && rows.length > 1 ? `M ${g.x} ${g.y0} L ${g.x} ${lastReal}` : "";
  const tail = hasBr && !drafting ? `M ${g.x} ${lastReal} L ${g.x} ${g.pts[total - 1].y}` : "";
  return `<div class="route${n <= 2 && !hasBr ? " tiny" : ""}${hasBr ? " hasbranch" : ""}" style="max-width:${hasBr ? 1000 : wMax}px;">
    <svg viewBox="0 0 ${RT.W} ${VH}" preserveAspectRatio="none" aria-hidden="true"
      ${hasBr ? `style="height:${Math.round(VH * BR.SCALE)}px"` : ""}>
      <defs><linearGradient id="${uid2}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="${lighten(routeCol)}"/><stop offset="100%" stop-color="${routeCol}"/>
      </linearGradient></defs>
      <path class="ln rest" d="${full}"/>
      ${cur > 0 ? `<path class="ln done" d="${done}" stroke="url(#${uid2})"/>` : ""}
      ${stem ? `<path class="ln branch" d="${stem}" stroke="${bc}"/>` : ""}
      ${rail ? `<path class="ln branch" d="${rail}" stroke="${bc}"/>` : ""}
      ${tail ? `<path class="ln branch tail" d="${tail}" stroke="${bc}"/>` : ""}
    </svg>
    <div class="pins">
      ${pts.map((pt, i) => {
        const early = i > cur && !!p.phases[i].done;
        const state = i < cur ? "done" : i === cur ? "current" : early ? "done early" : "future";
        const side = pt.y < RT.MID ? "up" : "down";
        const edge = i === 0 ? " first" : i === n - 1 ? " last" : "";
        const holdable = i > cur;
        const nst = (p.phases[i].steps || []).length;
        const opened = openIdx === i;
        return `<div class="pin ${state} ${side}${edge}${holdable ? " markable" : ""}${nst ? " hassteps" : ""}${opened ? " opened" : ""}"
          draggable="false" ondragstart="event.preventDefault();event.stopPropagation();return false;"
          style="left:${pt.x / RT.W * 100}%; top:${pt.y / VH * 100}%;"
          onclick="phaseClick(event,'${p.id}',${i})"
          ${holdable ? `onpointerdown="phaseHoldStart(event,'${p.id}',${i})"
            oncontextmenu="event.preventDefault()"
            title="Klik = odbočka s kroky · podrž ~1 s = ${early ? "zrušit hotovo" : "hotovo i mimo pořadí"}"`
          : `title="Klik = odbočka s kroky"`}>
          <div class="bead">${early ? "✓" : ""}</div>
          <div class="lab">${esc(p.phases[i].name)}${nst ? `<i class="scaret" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 1.5v4.2a2 2 0 0 0 2 2h4"/><circle cx="3.5" cy="1.5" r="0"/><path d="M8 5.8l1.7 1.9L8 9.6"/></svg></i>` : ""}</div>
        </div>`;
      }).join("")}
      ${hasBr ? rows.map((row, k) => {
        const pt = g.pts[k];
        const pos = `left:${pt.x / RT.W * 100}%; top:${pt.y / VH * 100}%;`;
        if(row.draft) return `<div class="pin bpin bdraft" style="${pos}">
          <div class="bead"></div>
          <div class="lab"><input class="stepinput" data-tok="${_stepDraft.tok}" placeholder="Napiš krok a dej Enter…"
            onkeydown="draftKey(event,this)" onblur="saveDraft(this,false)"></div>
        </div>`;
        const st = row.st;
        return `<div class="pin bpin ${st.done ? "bdone" : ""}"
          draggable="false" ondragstart="event.preventDefault();event.stopPropagation();return false;"
          style="${pos}"
          onpointerdown="stepHoldStart(event,'${p.id}',${openIdx},'${st.id}')"
          oncontextmenu="event.preventDefault()" title="Podrž ~1 s = hotovo">
          <div class="bead">${st.done ? "✓" : ""}</div>
          <div class="lab"><span class="btx">${esc(st.name)}</span>
            <button class="badd" onclick="addStep(event,'${p.id}',${openIdx},${row.i + 1})" title="Přidat krok pod tenhle">+</button>
            <button class="sx" onclick="removeStep(event,'${p.id}',${openIdx},'${st.id}')" title="Odstranit krok">✕</button>
          </div>
        </div>`;
      }).join("") : ""}
      ${hasBr && !drafting ? `<div class="pin bpin bplus"
        draggable="false" ondragstart="event.preventDefault();event.stopPropagation();return false;"
        style="left:${g.pts[total-1].x / RT.W * 100}%; top:${g.pts[total-1].y / VH * 100}%;"
        onclick="addStep(event,'${p.id}',${openIdx})" title="Přidat krok">
        <div class="bead">+</div>
        <div class="lab"><span class="btx">Přidat krok</span></div>
      </div>` : ""}
    </div>
  </div>
  ${hasBr ? `<div class="brbar">
    <span class="brbar-t">Odbočka ze zastávky <b>${esc(p.phases[openIdx].name)}</b></span>
    <span class="brbar-a"><button class="sec-link" onclick="setStepOpen('${p.id}',-1)">skrýt</button></span>
  </div>` : ""}`;
}

/* ---- osa: drag & drop nových bloků ---- */
function dragStart(e, type, id){
  e.dataTransfer.setData("text/plain", JSON.stringify({type, id}));
  e.dataTransfer.effectAllowed = "copy";
}
function laneTime(e){
  const lane = document.getElementById("planLane");
  const r = lane.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  return Math.round((TL_START + frac * TL_SPAN) / SNAP) * SNAP;
}
function planDragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect = "copy"; document.getElementById("planLane").classList.add("droppable"); }
function planDragLeave(e){ document.getElementById("planLane").classList.remove("droppable"); }
function planDrop(e){
  e.preventDefault();
  document.getElementById("planLane").classList.remove("droppable");
  let d;
  try { d = JSON.parse(e.dataTransfer.getData("text/plain")); } catch(_){ return; }
  let title = "Blok", color = "#1f4bff", refType = d.type, refId = d.id;
  if(d.type === "project"){
    const p = state.projects.find(x => x.id === d.id); if(!p) return;
    title = p.name; color = clientDot(p.clientId);
  } else if(d.type === "rhythm"){
    const r = state.rhythms.find(x => x.id === d.id); if(!r) return;
    title = r.name; color = clientDot(r.clientId);
  } else if(d.type === "quick"){
    const q = quickList().find(x => x.id === d.id); if(!q) return;
    title = q.title; color = q.color;
  } else return;
  const sh = Math.max(TL_START, Math.min(TL_END - 0.5, laneTime(e)));
  planBlocks().push({ id:uid(), refType, refId, title, color, sh, eh:Math.min(TL_END, sh + 1) });
  save(); render();
}
function planDblClick(e){
  if(e.target.closest(".tl-block")) return;
  const sh = Math.max(TL_START, Math.min(TL_END - 0.5, laneTime(e)));
  dialog("Vlastní blok", `
    <div class="field"><label>Název</label><input name="title" required placeholder="např. Deep work"></div>
    <div class="field-row">
      <div class="field"><label>Začátek</label><input name="sh" value="${fmtHM(sh)}" pattern="[0-2]?[0-9]:[0-5][0-9]"></div>
      <div class="field"><label>Délka (min)</label><input name="dur" type="number" value="60" min="15" step="15"></div>
    </div>
  `, "Přidat", fd => {
    const [h, m] = String(fd.get("sh")).split(":").map(Number);
    const s = Math.max(TL_START, Math.min(TL_END - 0.25, (h || 0) + (m || 0)/60));
    const dur = Math.max(0.25, Number(fd.get("dur") || 60) / 60);
    planBlocks().push({ id:uid(), refType:"custom", refId:null, title:fd.get("title").trim(),
      color:"#2f6df6", sh:s, eh:Math.min(TL_END, s + dur) });
    save(); closeDialog(); render();
  });
}
function removePlan(id){
  state.dayPlan[planDate] = planBlocks().filter(b => b.id !== id);
  save(); render();
}
function clearPlan(){

/* ---- osa: posun a délka existujících bloků ---- */
let _drag = null;
function planMoveStart(e, id){
  if(e.button !== 0 && e.pointerType === "mouse") return;
  const b = planBlocks().find(x => x.id === id); if(!b) return;
  e.preventDefault();
  const lane = document.getElementById("planLane").getBoundingClientRect();
  _drag = { mode:"move", b, lane, grabOffset:(e.clientX - lane.left) / lane.width * TL_SPAN + TL_START - b.sh, moved:false };
  document.addEventListener("pointermove", planPointerMove);
  document.addEventListener("pointerup", planPointerUp, {once:true});
}
function planResizeStart(e, id){
  const b = planBlocks().find(x => x.id === id); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  const lane = document.getElementById("planLane").getBoundingClientRect();
  _drag = { mode:"resize", b, lane, moved:false };
  document.addEventListener("pointermove", planPointerMove);
  document.addEventListener("pointerup", planPointerUp, {once:true});
}
function planPointerMove(e){
  if(!_drag) return;
  const { b, lane } = _drag;
  const t = TL_START + Math.max(0, Math.min(1, (e.clientX - lane.left) / lane.width)) * TL_SPAN;
  _drag.moved = true;
  if(_drag.mode === "move"){
    const dur = b.eh - b.sh;
    let sh = Math.round((t - _drag.grabOffset) / SNAP) * SNAP;
    sh = Math.max(TL_START, Math.min(TL_END - dur, sh));
    b.sh = sh; b.eh = sh + dur;
  } else {
    let eh = Math.round(t / SNAP) * SNAP;
    b.eh = Math.max(b.sh + SNAP, Math.min(TL_END, eh));
  }
  const el = document.getElementById("pb-" + b.id);
  if(el){
    el.style.left = ((b.sh - TL_START) / TL_SPAN * 100) + "%";
    el.style.width = ((b.eh - b.sh) / TL_SPAN * 100) + "%";
    const t1 = el.querySelector(".t");
    if(t1) t1.textContent = fmtHM(b.sh) + "–" + fmtHM(b.eh);
  }
}
function planPointerUp(){
  document.removeEventListener("pointermove", planPointerMove);
  if(_drag && _drag.moved){ save(); render(); }
  _drag = null;
}

/* přesun už umístěné položky mezi sekcemi (den ↔ den, část dne ↔ část dne) */
function moveStart(e, src, key, id){
  e.stopPropagation();
  e.dataTransfer.setData("text/plain", JSON.stringify({ type:"move", src, key, id }));
  e.dataTransfer.effectAllowed = "copyMove";
  const t = document.getElementById("trashZone");
  if(t) setTimeout(() => t.classList.add("show"), 0);
}
function moveEnd(){
  const t = document.getElementById("trashZone");
  if(t){ t.classList.remove("show"); t.classList.remove("droppable"); }
}
document.addEventListener("dragend", moveEnd);
function trashDrop(e){
  e.preventDefault();
  let d;
  try { d = JSON.parse(e.dataTransfer.getData("text/plain")); } catch(_){ moveEnd(); return; }
  const it = takeMoved(d);
  moveEnd();
  if(!it) return;
  save(); render();
  toast(`„${it.title}" odstraněno`, "Vrátit", () => {
    if(d.src === "week"){ if(!state.weekPlan[d.key]) state.weekPlan[d.key] = []; state.weekPlan[d.key].push(it); }
    else if(d.src === "casti"){ modeData().casti[d.key].push(it); }
    save(); render();
  });
}
function takeMoved(d){
  if(d.type !== "move") return null;
  let arr = null;
  if(d.src === "week") arr = state.weekPlan[d.key];
  else if(d.src === "casti"){ const dm = state.dayModes[planDate]; arr = dm && dm.casti ? dm.casti[d.key] : null; }
  if(!Array.isArray(arr)) return null;
  const i = arr.findIndex(x => x.id === d.id);
  if(i < 0) return null;
  return arr.splice(i, 1)[0];
}

function zoneLeave(id){ const el = document.getElementById(id); if(el) el.classList.remove("droppable"); }
function zoneDrop(e, kind, slot){

  let d;
  try { d = JSON.parse(e.dataTransfer.getData("text/plain")); } catch(_){ return; }
  const it = d.type === "move" ? takeMoved(d) : dropItemFrom(d);
  if(!it) return;
  modeData()[kind][slot].push(it);
  save(); render();
}
function zoneRemove(kind, slot, id){
  const d = modeData();
  d[kind][slot] = d[kind][slot].filter(x => x.id !== id);
  save(); render();
}
function zoneAddDialog(kind, slot, label){
  dialog(label || "Vlastní položka", `
    <div class="field"><label>Co to je</label><input name="title" required placeholder="např. Objednávka Blendea"></div>
  `, "Přidat", fd => {
    const it = { id:uid(), refType:"custom", refId:null, title:fd.get("title").trim(), color:"#2f6df6" };
    modeData()[kind][slot].push(it);
    save(); closeDialog(); render();
  });
}
function zoneChips(kind, slot, items){
  return items.map(f => `<div class="focus-chip" draggable="true" ondragstart="moveStart(event,'${kind}','${slot}','${f.id}')"
    style="background:${tint(f.color || "#1f4bff",.20)};color:${lighten(f.color || "#1f4bff")};">${esc(f.title)}<button class="fx" onclick="zoneRemove('${kind}','${slot}','${f.id}')">✕</button></div>`).join("");
}
function zoneBoxHtml(kind, slot, label, sub, items, minH){
  const id = `zone-${kind}-${slot}`;
  return `<div class="wday" id="${id}" style="min-height:${minH || 110}px;"
    ondragover="zoneOver(event,'${id}')" ondragleave="zoneLeave('${id}')" ondrop="zoneDrop(event,'${kind}','${slot}')">
    <div class="dh"><span class="dn">${label}</span><span class="dd">${sub || ""}</span></div>
    ${zoneChips(kind, slot, items)}
    <button class="addf" onclick="zoneAddDialog('${kind}','${slot}','${label}')" title="Přidat vlastní">+</button>
  </div>`;
}

function setClientFilter(id){ clientFilter = id; render(); }
function setRhythmFilter(k){ rhythmFilter = k; render(); }
function setNoteFilter(k){ noteFilter = k; render(); }

function confirmRhythm(id){
  const r = state.rhythms.find(x => x.id === id); if(!r) return;
  r.prevLastRunAt = r.lastRunAt;
  r.lastRunAt = Date.now();
  state.history.push({type:"rhythm", id, at:Date.now()});
  save(); render();
  toast(`„${r.name}" — hotovo dnes ✓`, "Vrátit", () => unconfirmRhythm(id));
}
function unconfirmRhythm(id){
  const r = state.rhythms.find(x => x.id === id); if(!r) return;
  if(typeof r.prevLastRunAt === "number") r.lastRunAt = r.prevLastRunAt;
  else r.lastRunAt = Date.now() - r.everyDays * DAY;
  delete r.prevLastRunAt;
  state.history = state.history.filter(h => !(h.type === "rhythm" && h.id === id && isToday(h.at)));
  save(); render();
}
function removeRhythm(id){
  const r = state.rhythms.find(x => x.id === id); if(!r) return;
  if(!window.confirm(`Odebrat „${r.name}" z rytmu?`)) return;
  state.rhythms = state.rhythms.filter(x => x.id !== id);
  save(); render();
}
function advancePhase(id){
  const p = state.projects.find(x => x.id === id);
  if(!p || p.done) return;
  if(p.currentPhaseIndex < p.phases.length - 1){
    p.currentPhaseIndex++;
    state.history.push({type:"phase", id, to:p.currentPhaseIndex, at:Date.now()});
    save(); render();
    const note = document.getElementById("pnote-" + id);
    if(note){
      note.textContent = "Posunuto do fáze " + p.phases[p.currentPhaseIndex].name;
      note.style.opacity = 1;
      setTimeout(() => { note.style.opacity = 0; }, 3400);
    }
  } else {
    p.done = true;
    state.history.push({type:"phase-done", id, at:Date.now()});
    save(); render();
    toast(`Projekt „${p.name}" dokončen 🎉`);
  }
}
function addNote(){
  const inp = document.getElementById("mindInput");
  const text = (inp.value || "").trim(); if(!text) return;
  const cat = noteFilter === "all" ? "práce" : noteFilter;
  state.notes.unshift({id:uid(), text, category:cat, createdAt:Date.now()});
  save(); render();
  const again = document.getElementById("mindInput");
  if(again) again.focus();
}
function removeNote(id){
  const el = document.getElementById("note-" + id);
  if(el) el.classList.add("fading");
  setTimeout(() => { state.notes = state.notes.filter(n => n.id !== id); save(); render(); }, 300);
}

function weekFocusDays(cid){
  let days = 0;
  weekDates().forEach(k => {
    const has = (state.weekPlan[k] || []).some(b => {
      if(b.refType === "project"){ const p = state.projects.find(x => x.id === b.refId); return p && p.clientId === cid; }
      if(b.refType === "rhythm"){ const r = state.rhythms.find(x => x.id === b.refId); return r && r.clientId === cid; }
      return false;
    });
    if(has) days++;
  });
  return days;
}
function activeMilestoneIndex(c){
  return (c.milestones || []).findIndex(m => !m.done);
}

function achieveMilestone(cid){
  const c = state.clients.find(x => x.id === cid); if(!c) return;
  const ai = activeMilestoneIndex(c); if(ai < 0) return;
  const m = c.milestones[ai];
  if(!window.confirm(`Milník „${m.name}" je dosažený?`)) return;
  m.done = true; m.doneAt = Date.now();
  state.history.push({type:"milestone", clientId:cid, id:m.id, at:Date.now()});
  save(); render();
  toast(`🎉 Milník dosažen: ${m.name}`, "Vrátit", () => { m.done = false; delete m.doneAt; save(); render(); });
}

function exportJson(){

  a.download = "dnes-boxy-zaloha-" + todayStr() + ".json";

}
function importJson(e){
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || typeof d !== "object") throw new Error("Neplatný soubor.");
      applyingRemote = false;
      state = Object.assign(blank(), state, d, {sync: state.sync});
      ["clients","rhythms","projects","notes","history","tasks","labels","sections"].forEach(k => {
        if(!Array.isArray(state[k])) state[k] = [];
      });
      if(!state.dayPlan || typeof state.dayPlan !== "object") state.dayPlan = {};
      if(!state.weekPlan || typeof state.weekPlan !== "object") state.weekPlan = {};
      save(); closeDialog(); render();
      toast("Data načtena ze zálohy.");
    } catch(err){ toast("Import se nepovedl: " + err.message); }
  };
  r.readAsText(f);
  e.target.value = "";
}

/* ============================================================
   SYNC — Supabase (převzato z původní aplikace, rozšířený payload)
   ============================================================ */
const SB = { lib:null, client:null, user:null, channel:null, status:"off", error:null, pushTimer:null, pulling:false };

function sbConfigured(){ return !!(state.sync.url && state.sync.key); }

function sbLoadScript(){
  if(window.supabase && window.supabase.createClient) return Promise.resolve();
  if(sbLoadScript._p) return sbLoadScript._p;
  sbLoadScript._p = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
    s.onload = res;
    s.onerror = () => rej(new Error("Nepodařilo se načíst knihovnu syncu (jsi offline?)."));
    document.head.appendChild(s);
  });
  return sbLoadScript._p;
}

async function sbInit(){
  if(!sbConfigured()) return;
  sbSetStatus("connecting");
  try{
    await sbLoadScript();
    SB.client = window.supabase.createClient(state.sync.url.trim(), state.sync.key.trim(), {
      auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}
    });
    const {data:{session}} = await SB.client.auth.getSession();
    SB.user = session ? session.user : null;
    SB.client.auth.onAuthStateChange((_e, s) => {
      SB.user = s ? s.user : null;
      if(SB.user){ sbPull().then(() => { sbSubscribe(); vyFetch(); vySubscribe(); }); } else { sbSetStatus("off"); }
      renderSyncModal();
    });
    if(SB.user){ await sbPull(); sbSubscribe(); vyFetch(); vySubscribe(); }
    else sbSetStatus("off");
  } catch(e){ SB.error = e.message; sbSetStatus("error"); }
  renderSyncModal();
}

function sbSetStatus(s){
  SB.status = s;
  if(s !== "error") SB.error = null;
  const el = document.getElementById("syncPill");
  if(!el) return;
  const map = {
    off:{t:"Sync vypnutý", c:"off"}, connecting:{t:"Připojuji…", c:"wait"},
    online:{t:"Synchronizováno", c:"on"}, saving:{t:"Ukládám…", c:"wait"},
    offline:{t:"Offline", c:"wait"}, error:{t:SB.error || "Chyba syncu", c:"err"}
  };
  const m = map[s] || map.off;
  el.hidden = !sbConfigured();
  el.className = "syncpill " + m.c;
  el.innerHTML = `<span class="led"></span><span>${esc(m.t)}</span>`;
}

function applyRemote(remote){
  applyingRemote = true;
  state.tasks = remote.tasks;
  state.labels = remote.labels && remote.labels.length ? remote.labels : state.labels;
  state.sections = Array.isArray(remote.sections) ? remote.sections : state.sections;
  state.settings = Object.assign(state.settings, remote.settings || {});
  state.google = Object.assign(state.google, remote.google || {});
  ["clients","rhythms","projects","notes","history","systems","metrics"].forEach(k => {
    if(Array.isArray(remote[k])) state[k] = remote[k];
  });
  if(Array.isArray(remote.quickBlocks) && remote.quickBlocks.length) state.quickBlocks = remote.quickBlocks;
  if(remote.dayPlan && typeof remote.dayPlan === "object") state.dayPlan = remote.dayPlan;
  if(remote.weekPlan && typeof remote.weekPlan === "object") state.weekPlan = remote.weekPlan;
  if(remote.dayModes && typeof remote.dayModes === "object") state.dayModes = remote.dayModes;
  if(remote.boxyMigrated) state.boxyMigrated = remote.boxyMigrated;
  state.updatedAt = remote.updatedAt || Date.now();
  save(); applyingRemote = false;
  render();
}

async function sbPull(){
  if(!SB.client || !SB.user) return;
  SB.pulling = true;
  try{
    const {data, error} = await SB.client.from("planner").select("data").eq("user_id", SB.user.id).maybeSingle();
    if(error) throw error;
    const remote = data && data.data;
    if(remote && Array.isArray(remote.tasks) && (remote.updatedAt || 0) > (state.updatedAt || 0)){
      applyRemote(remote);
      migrateBoxy();
      sbSetStatus("online");
    } else {
      await sbPush(true);
    }
  } catch(e){ SB.error = e.message || String(e); sbSetStatus("error"); }
  SB.pulling = false;
}

function sbSchedulePush(){
  if(!SB.client || !SB.user || SB.pulling) return;
  clearTimeout(SB.pushTimer);
  sbSetStatus("saving");
  SB.pushTimer = setTimeout(() => sbPush(), 1200);
}

async function sbPush(silent){
  if(!SB.client || !SB.user) return;
  if(!silent) sbSetStatus("saving");
  try{
    const {error} = await SB.client.from("planner").upsert({
      user_id: SB.user.id, data: payload(), updated_at: new Date().toISOString()
    }, {onConflict:"user_id"});
    if(error) throw error;
    sbSetStatus("online");
  } catch(e){
    SB.error = e.message || String(e);
    sbSetStatus(navigator.onLine ? "error" : "offline");
  }
}

function sbSubscribe(){
  if(!SB.client || !SB.user || SB.channel) return;
  SB.channel = SB.client
    .channel("planner-sync")
    .on("postgres_changes",
      {event:"*", schema:"public", table:"planner", filter:"user_id=eq." + SB.user.id},
      p => {
        const remote = p.new && p.new.data;
        if(!remote || !Array.isArray(remote.tasks)) return;
        if((remote.updatedAt || 0) <= (state.updatedAt || 0)) return;
        applyRemote(remote);
        toast("Načteno z druhého zařízení.");
      })
    .subscribe();
}

async function sbSignIn(email){
  if(!SB.client) await sbInit();
  if(!SB.client) throw new Error("Sync není nastavený.");
  const {error} = await SB.client.auth.signInWithOtp({
    email, options:{emailRedirectTo: location.href.split("#")[0]}
  });
  if(error) throw error;
}
async function sbSignOut(){
  if(SB.channel){ try{ SB.client.removeChannel(SB.channel); }catch(_){} SB.channel = null; }
  if(SB.client) await SB.client.auth.signOut();
  SB.user = null; sbSetStatus("off"); renderSyncModal();
}
window.addEventListener("online", () => { if(SB.user) sbPush(); });
window.addEventListener("offline", () => { if(sbConfigured()) sbSetStatus("offline"); });

const VY = { list:[], channel:null };

async function vyFetch(){
  if(!SB.client || !SB.user) return;
  try{
    const since = new Date(Date.now() - 7 * DAY).toISOString();
    const {data, error} = await SB.client.from("vystupy").select("*")
      .gte("created_at", since).order("created_at", {ascending:false}).limit(50);
    if(error) return;                       // tabulka ještě nemusí existovat
    VY.list = data || [];
    vyApply(); render();
  } catch(e){}
}
function vyApply(){
  let changed = false;
  VY.list.forEach(row => {
    const created = new Date(row.created_at).getTime();
    if(!isToday(created)) return;
    const key = String(row.rhythm_name || "").trim().toLowerCase();
    if(!key) return;
    const r = state.rhythms.find(x => x.name.trim().toLowerCase() === key);
    if(r && !isToday(r.lastRunAt)){
      r.prevLastRunAt = r.lastRunAt;
      r.lastRunAt = created;
      r.autoBy = "claude";
      state.history.push({type:"rhythm", id:r.id, at:created, by:"claude"});
      changed = true;
    }
  });
  if(changed) save();
}
function vySubscribe(){
  if(!SB.client || !SB.user || VY.channel) return;
  try{
    VY.channel = SB.client.channel("vystupy-sync")
      .on("postgres_changes", {event:"INSERT", schema:"public", table:"vystupy"}, p => {
        if(!p.new) return;
        VY.list.unshift(p.new);
        vyApply(); render();
        toast("✳ Claude dokončil: " + (p.new.title || p.new.rhythm_name || "výstup"));
      }).subscribe();
  } catch(e){}
}

function sysHoldStart(e, id){

  }, 700), el };

  if(!_sysHold) return;

  const manual = (typeof m.manualValue === "number" && m.manualAt) ? { value:m.manualValue, at:m.manualAt, by:"manual" } : null;
  if(claude && manual) return claude.at >= manual.at ? claude : manual;

    <p class="lead"><b>2.</b> Druhému Claudovi nainstaluj skill „boxy-vystupy", který ti dám — do něj vyplníš URL projektu a anon klíč (stejné jako v syncu).</p>
  `, null, null);
}

/* ============================================================
   GOOGLE KALENDÁŘ — pouze čtení (převzato z původní aplikace)
   ============================================================ */
const SCOPE = "https://www.googleapis.com/auth/calendar.readonly";
const G = { ready:false, client:null, token:null, exp:0, calendars:[], cache:{}, loading:false, error:null };

function gConnected(){ return !!(G.token && Date.now() < G.exp); }

function gLoadScript(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if(gLoadScript._p) return gLoadScript._p;
  gLoadScript._p = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = res;
    s.onerror = () => rej(new Error("Nepodařilo se načíst Google skript (jsi offline?)."));
    document.head.appendChild(s);
  });
  return gLoadScript._p;
}

async function gInit(){
  const id = (state.google.clientId || "").trim();
  if(!id) throw new Error("Chybí Client ID.");
  await gLoadScript();
  G.client = google.accounts.oauth2.initTokenClient({ client_id:id, scope:SCOPE, callback:() => {} });
  G.ready = true;
}

function gAuth(interactive){
  return new Promise((res, rej) => {
    if(!G.client) return rej(new Error("Google klient není připravený."));
    G.client.callback = resp => {
      if(resp.error) return rej(new Error(resp.error_description || resp.error));
      G.token = resp.access_token;
      G.exp = Date.now() + (Number(resp.expires_in || 3600) - 60) * 1000;
      res(resp);
    };
    try{ G.client.requestAccessToken({prompt: interactive ? "consent" : ""}); }
    catch(e){ rej(e); }
  });
}

async function gApi(path, params){
  if(!gConnected()) await gAuth(false);
  const url = new URL("https://www.googleapis.com/calendar/v3/" + path);
  Object.entries(params || {}).forEach(([k,v]) => url.searchParams.set(k, v));
  const r = await fetch(url, {headers:{Authorization:"Bearer " + G.token}});
  if(r.status === 401 || r.status === 403){
    G.token = null;
    await gAuth(false);
    const r2 = await fetch(url, {headers:{Authorization:"Bearer " + G.token}});
    if(!r2.ok) throw new Error("Google odmítl požadavek (" + r2.status + ").");
    return r2.json();
  }
  if(!r.ok) throw new Error("Google vrátil chybu " + r.status + ".");
  return r.json();
}

async function gFetchCalendars(){
  const d = await gApi("users/me/calendarList", {maxResults:250, minAccessRole:"reader"});
  G.calendars = (d.items || []).map(c => ({
    id:c.id, name:c.summaryOverride || c.summary || c.id,
    color:c.backgroundColor || "#9AA0A6", primary:!!c.primary
  }));
}

async function gFetchDay(dateStr){
  if(G.cache[dateStr]) return G.cache[dateStr];
  const start = parseDate(dateStr);
  const end = new Date(start); end.setDate(end.getDate() + 1);
  const active = G.calendars.filter(c => !state.google.hidden.includes(c.id));
  const all = [];
  for(const c of active){
    try{
      const d = await gApi("calendars/" + encodeURIComponent(c.id) + "/events", {
        timeMin:start.toISOString(), timeMax:end.toISOString(),
        singleEvents:"true", orderBy:"startTime", maxResults:100
      });
      (d.items || []).forEach(ev => {
        if(ev.status === "cancelled") return;
        all.push({
          id:ev.id, title:ev.summary || "(bez názvu)",
          allDay:!ev.start.dateTime,
          start:ev.start.dateTime || ev.start.date,
          end:(ev.end && (ev.end.dateTime || ev.end.date)) || null,
          color:c.color, calendar:c.name, calendarId:c.id
        });
      });
    } catch(e){ G.error = e.message; }
  }
  G.cache[dateStr] = all;
  return all;
}

async function gRefresh(interactive){
  if(!state.google.clientId) return;
  G.loading = true; G.error = null;
  if(view === "dnes") renderDnes();
  try{
    if(!G.ready) await gInit();
    if(!gConnected()) await gAuth(!!interactive);
    if(!G.calendars.length) await gFetchCalendars();
    await gFetchDay(selDate);
    for(const k of weekDates()){ if(!G.cache[k]) await gFetchDay(k); }
  } catch(e){ G.error = e.message; }
  G.loading = false;
  render();
}
function gManualRefresh(){
  G.cache = {};
  gRefresh(!gConnected());
}

function openGModal(){
  closeDialog();
  dialog("Google Kalendář (jen čtení)", `
    <div id="gBadge"></div>
    <div id="gSetup">
      <p class="lead">V <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener">Google Cloud Console</a> si vytvoř OAuth Client ID (typ „Webová aplikace") a do povolených JavaScript origins přidej: <b id="gOrigin"></b></p>
      <div class="field"><label>Client ID</label>
        <input id="gClientId" placeholder="…apps.googleusercontent.com" autocomplete="off" spellcheck="false"></div>
    </div>
    <div class="field-row">
      <button type="button" id="gConnect" class="btn-primary" style="flex:1" onclick="gConnectClick()">Připojit</button>
      <button type="button" id="gDisconnect" class="btn-light" hidden onclick="gDisconnectClick()">Odpojit</button>
    </div>
    <div id="gCalendars"></div>
  `, null, null);
  document.getElementById("gOrigin").textContent = location.origin === "null" ? location.href : location.origin;
  document.getElementById("gClientId").value = state.google.clientId || "";
  renderGModal();
}
function renderGModal(){
  const badge = document.getElementById("gBadge");
  if(!badge) return;
  const on = gConnected();
  badge.innerHTML = G.error
    ? `<span class="badge-line err">Chyba: ${esc(G.error)}</span>`
    : on ? `<span class="badge-line ok">Připojeno</span>` : `<span class="badge-line mut">Nepřipojeno</span>`;
  const dis = document.getElementById("gDisconnect"), con = document.getElementById("gConnect"), setp = document.getElementById("gSetup");
  if(dis) dis.hidden = !on;
  if(con) con.textContent = on ? "Načíst znovu" : "Připojit";
  if(setp) setp.hidden = on;
  const wrap = document.getElementById("gCalendars");
  if(wrap){
    wrap.innerHTML = G.calendars.length ? `<div class="field"><label>Kalendáře na ose</label>` +
      G.calendars.map(c => `
        <label class="cal-row"><input type="checkbox" ${state.google.hidden.includes(c.id) ? "" : "checked"}
          onchange="gToggleCal('${esc(c.id)}', this.checked)">
          <span class="cal-dot" style="background:${esc(c.color)}"></span>${esc(c.name)}${c.primary ? " · hlavní" : ""}</label>`).join("") + `</div>` : "";
  }
}
async function gConnectClick(){
  const id = (document.getElementById("gClientId") || {}).value;
  if(id !== undefined && id.trim()){ state.google.clientId = id.trim(); save(); }
  try{
    G.cache = {}; G.calendars = [];
    await gRefresh(true);
    renderGModal();
  } catch(e){ toast(e.message || String(e)); }
}
function gDisconnectClick(){
  G.token = null; G.exp = 0; G.cache = {};
  renderGModal(); render();
}
function gToggleCal(id, visible){
  if(visible) state.google.hidden = state.google.hidden.filter(x => x !== id);
  else if(!state.google.hidden.includes(id)) state.google.hidden.push(id);
  save();
  G.cache = {};
  gRefresh();
}

/* ============================================================
   ROOT
   ============================================================ */
function render(){
  renderSidebar();
  if(view === "dnes" || view === "vize") renderDnes();
  else if(view === "archiv") renderArchiv();
  else {
    const p = state.projects.find(x => x.id === view);
    if(p) renderWorkspace(p); else { view = "dnes"; renderDnes(); }
  }
  sbSetStatus(SB.status);
  paintRoutes();
}
/* dokreslí ujetou část trasy — délku křivky změříme až po vykreslení */
function focusDraft(){
  const inp = document.querySelector(".stepinput");
  if(inp && document.activeElement !== inp){ inp.focus(); }
}
function paintRoutes(){
  focusDraft();
  document.querySelectorAll(".ln.done").forEach(el => {
    let len = 0;
    try { len = el.getTotalLength(); } catch(e){ return; }
    if(!len) return;
    el.style.strokeDasharray = len + "px";
    el.style.strokeDashoffset = len + "px";
    el.getBoundingClientRect();
    el.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)";
    el.style.strokeDashoffset = "0px";
  });
}

migrateBoxy();
upgradeAreas();
render();
if(sbConfigured()) sbInit();
if(state.google.clientId) gRefresh();
setInterval(() => {
  if(_drag) return;
  const t = todayStr();
  if(t !== selDate){ selDate = t; planDate = t; G.cache = {}; if(state.google.clientId) gRefresh(); }
  if(view === "dnes" && !document.querySelector(".overlay")) renderDnes();
}, 30000);
